# Build dropssh for every supported target, and PROVE the artefact.
#
# ⛔ THE JOB THAT MATTERS IS NOT THE BUILD, IT IS THE SESSION. A dropssh that
# compiles and a dropbear that links are both cheap; a dropbear that cannot log
# anyone in is the failure this workflow exists to prevent, and it is invisible
# to every other check in this file. The `prove` job runs tests/e2e.sh against
# the artefact this workflow produced, on the target that can execute, with
# real bytes and a real ssh client.
#
# ⛔ EACH HALF IS STATIC AND THE REASONS ARE DIFFERENT. dropssh is static
# musl, because it is the binary a user downloads and it has to run in a
# cage with no libc. dropbear is static musl by default because it reads its
# user database from a file (-Y) and needs no shim; dynamic glibc stays
# available with --dropbear-target for --preload users. Measured, in
# docs/decisions-tls.md. The `prove` job runs tests/e2e.sh against the
# artefact this workflow produced, with real bytes and a real ssh client.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # ⛔ THE SCHEDULE IS WHY THE RELAY'S OWN DOCUMENT IS CHECKED AT ALL, AND IT IS
  # NOT ON EVERY COMMIT BECAUSE IT NEEDS THE NETWORK.
  #
  # Nothing in this repository talks to the relay during a normal build, so a
  # change to the protocol is invisible here until it becomes a close code in
  # the field. The relay's version was `2026-09-28-r11` when this project's
  # measurements were taken and `2026-09-28-r12` later the same day, and A2 --
  # "the operator's leg is data-only" -- was added between them, in response to
  # our own issue. Our client already works around it, so nothing here would
  # have noticed.
  schedule:
    # 04:17 UTC daily. An off-the-hour minute on purpose: every workflow that
    # fires at :00 is queued behind everyone else's, and this one fetches from a
    # third party.
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: dropssh-${{ github.ref }}
  cancel-in-progress: true

env:
  # The dropbear source is pinned by COMMIT, not by version. The version lives
  # in src/sysoptions.h and not in a ref, so `git clone --branch 2026.94` fails
  # with "Remote branch not found", and a published artefact with a patch in it
  # must be pinned to something that cannot move.
  DROPBEAR_COMMIT: 59870ad43153fe8d4f1c96f5d5752116c94f31ff
  ZIG_VERSION: 0.13.0

jobs:
  dropssh:
    name: dropssh (static, musl) ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Only targets where zig cc can produce a genuinely static binary. A
        # musl target is required: a gnu target under zig cc falls back to a
        # dynamic link and the build asserts against that, because a
        # dynamically linked dropssh does not run in the cage it exists for.
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - arm-linux-musleabihf
          - x86-linux-musl        # zig's name for 32-bit x86. "i386-linux-musl"
                                 # is not a target: `zig cc` answers
                                 # "unable to parse target query
                                 # 'i386-linux-musl': UnknownArchitecture".
                                 # Naming it in the matrix produces a red job
                                 # for a target that does not exist.
          - riscv64-linux-musl
          - powerpc64le-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: build
        run: ./scripts/build.sh --target ${{ matrix.target }} --out dist/${{ matrix.target }}

      - name: the artefact is a static binary
        run: |
          set -euo pipefail
          file "dist/${{ matrix.target }}/dropssh"
          # ⛔ READ THE EXIT CODE FROM `file` ITSELF, NOT FROM A PIPE. A pipe
          # reports the last command's status, so a grep that found nothing
          # would be read as success and the check would never fail.
          file -b "dist/${{ matrix.target }}/dropssh" > linkage.txt
          grep -q 'statically linked' linkage.txt \
            || { echo "::error::dropssh is not statically linked for ${{ matrix.target }}"; exit 1; }
          cat "dist/${{ matrix.target }}/BUILDINFO"

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: dropssh-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30

  dropbear:
    name: dropbear (static, musl) ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Static musl, the default server: -Y reads the passwd file, so no
        # shim is needed on any of these. All six verified building from one
        # checkout; the prove job carries a real session on x86_64.
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - arm-linux-musleabihf
          - x86-linux-musl
          - riscv64-linux-musl
          - powerpc64le-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: build dropbear
        run: |
          set -euo pipefail
          ./scripts/build-dropbear.sh "${{ matrix.target }}" "dist/${{ matrix.target }}" "$DROPBEAR_COMMIT"
          # ⛔ THE LINKAGE IS ASSERTED ON THE ARTEFACT. A musl server that is
          # not static cannot serve: musl getnameinfo refuses AF_UNIX and
          # serve always runs the server on a socketpair, so anything but
          # static dies before any session (measured 2026-09-30).
          file -b "dist/${{ matrix.target }}/dropbear" > linkage.txt
          cat linkage.txt
          grep -qE 'statically linked|static-pie linked' linkage.txt \
            || { echo "::error::dropbear is not static for ${{ matrix.target }}"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dropbear-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30

  glibc-optout:
    name: the glibc server still builds dynamic, on request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: the opt-out path still works
        # --preload users and hosts that prefer it take a dynamic glibc
        # server with an explicit --dropbear-target. This job keeps that path
        # compiling and dynamic; the default (static musl) is built above.
        run: |
          set -euo pipefail
          ./scripts/build-dropbear.sh x86_64-linux-gnu dist/optout 2>optout.log || { cat optout.log; exit 1; }
          file -b dist/optout/dropbear > linkage.txt
          cat linkage.txt
          grep -q 'dynamically linked' linkage.txt \
            || { echo "::error::the glibc server is not dynamic"; exit 1; }
          [ -f dist/optout/fakepwd.so ] \
            || { echo "::error::the glibc server shipped without its shim"; exit 1; }

  prove:
    name: prove the x86_64 artefact carries a session
    runs-on: ubuntu-latest
    needs: [dropssh, dropbear, glibc-optout]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: build for the runner
        run: ./scripts/build.sh --target x86_64-linux-musl --out dist/x86_64-linux-musl

      - name: the ssh client this needs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client

      - name: prove it
        # ⛔ THE EXIT CODE IS READ FROM THE SCRIPT AND NEVER THROUGH A PIPE.
        # `tests/e2e.sh | tee log` reports tee's status, so a failing e2e
        # would be published as green, and this job is the one that exists to
        # stop exactly that.
        run: |
          set -euo pipefail
          ./tests/e2e.sh dist/x86_64-linux-musl 2>&1 | tee e2e.log
          exit "${PIPESTATUS[0]}"

      - name: upload the proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log
          path: e2e.log
          if-no-files-found: warn

  release:
    name: release
    needs: [prove]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: build the release set
        run: |
          set -euo pipefail
          ./scripts/build.sh --target x86_64-linux-musl --out dist/x86_64-linux-musl

      - name: package
        run: |
          set -euo pipefail
          cd dist/x86_64-linux-musl
          tar czf ../../dropssh-x86_64-linux-musl.tar.gz \
            dropssh dropbear dropbearkey fakepwd.so passwd BUILDINFO SHA256SUMS
          cd ../..
          ls -la dropssh-x86_64-linux-musl.tar.gz

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: dropssh-x86_64-linux-musl.tar.gz
          generate_release_notes: true
          body: |
            dropssh: dropbear with a relay built in.

            Two artefacts, both static, for different measured reasons:

            * `dropssh` is **static musl**. It is the binary you download and
              run, and it runs in a cage with no libc.
            * `dropbear` is **static musl** too, served with `-Y` for its user
              database and no shim. Dynamic glibc stays available with
              `--dropbear-target` for `--preload` users.

            Quick start, on a machine with no pty, no `/etc/passwd` and only
            HTTPS egress:

                # inside the cage
                ./dropbearkey -t ed25519 -f hostkey
                mkdir -p ak && cp ~/.ssh/id_ed25519.pub ak/authorized_keys && chmod 600 ak/authorized_keys
                ./dropssh serve --name mycage \
                    --server './dropbear -i -E -F -r hostkey -D ak -Y ./passwd'

                # from your own machine
                ssh -o ProxyCommand='./dropssh connect --name mycage' root@mycage

            To reach a public ssh gateway through a relay instead, no node
            needed:

                ssh -o ProxyCommand='./dropssh connect --mint' root@railway.new

            `dropssh connect` mints its own relay token. No token is in this
            repository and none is needed to get started.


  # ⛔ THE RELAY'S OWN DOCUMENT, ON A SCHEDULE, AS A DRIFT REPORT AND NOT AS A
  # BUILD GATE.
  #
  # R8 asked for the reference operator fetched and pinned. There is no
  # repository in this project to pin -- the relay publishes a Cloudflare
  # Worker, and what it SERVES is the thing a client talks to -- so this fetches
  # what is served, records the version it came from, and re-checks the five
  # facts this repository measured and wrote down.
  #
  # `continue-on-error: true` because a drift is a thing to READ, not a build to
  # break: the relay is somebody else's deployment and its version moving is not
  # this repository failing. A red job would train everyone to ignore red jobs,
  # and the next red job might be a real one. The artifact is uploaded so the
  # diff is reviewable, and the job's own log says what to do about it.
  relay-spec:
    name: the relay's own protocol document, and whether it still says what we measured
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: fetch the served document and re-check our five measured facts
        run: |
          set -u
          ./scripts/fetch-relay-spec.sh || rc=$?
          rc=${rc:-0}
          echo "---- what this repository believes, for the diff"
          sed -n '1,40p' docs/relay-spec/RELAY-SPEC-VERSION || true
          if [ "$rc" = 1 ]; then
            echo ""
            echo "::warning title=relay protocol drift::One or more of the five"
            echo "::warning facts this repository measured no longer appear in the"
            echo "::warning relay's served document. Read docs/relay-spec/, then"
            echo "::warning re-measure and update the docs, or record why the new"
            echo "::warning form is equivalent. Do not re-pin silently."
          fi
          exit 0
      - name: upload what the relay is serving
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-spec
          path: docs/relay-spec/
          if-no-files-found: warn


  # ⛔ R2: A SESSION AGAINST THE REAL RELAY, ON A SCHEDULE, WITH NO SECRET.
  #
  # ⛔ AND THE PREVIOUS VERSION OF THIS JOB WAS WRONG ABOUT ITS OWN BLOCKER.
  # It said a pair "is per-pair and per-role and cannot be obtained from the
  # outside", needed three repository secrets, and reported "no credential" as
  # an outcome a reader should accept. Read against the relay's OWN served
  # documentation (llms.txt, version 2026-09-28-r12) that is false:
  # `POST /v1/pair` with an empty body is SELF-SERVICE, the agent mints it
  # itself, and `expires` is "never later than 72h after creation". R2 never
  # needed a secret. It needed somebody to read the relay's documentation,
  # which is the same failure as #8 of dropssh#10: a claim about someone else's
  # service, made from memory and carried in prose, drifts from the service.
  #
  # So the job mints its own pair on every run and stores nothing: a stored pair
  # is a credential in a repository, and a pair expires anyway. ⛔ AND THE
  # RELAY'S VERSION IS FETCHED AND PRINTED, because every assertion in the
  # script is a claim about a service whose specification can move under us.
  #
  # Measured live on 2026-09-28 against r12, from a cage that cannot bind INET:
  # a pubkey login to uid 0, 270528 bytes byte for byte, and two sessions alive
  # at once on ONE node socket, with a server whose environment contains no
  # LD_PRELOAD and which reads its passwd database from a file.
  relay-session:
    name: a real session against the real relay, on a pair it mints itself
    runs-on: ubuntu-latest
    needs: [dropssh, dropbear]
    timeout-minutes: 25
    # ⛔ continue-on-error, because a third party's deployment is not this
    # repository failing, and a scheduled job that goes red for reasons outside
    # the tree teaches people to ignore it. The build info is uploaded either
    # way and `::error::` still shows on the run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: the ssh client this needs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client
      - name: build
        run: ./scripts/build.sh --target x86_64-linux-musl --out dist/x86_64-linux-musl
      - name: carry a real session, on a pair this run mints
        env:
          RELAY: tcp.ssh.relay.ajam.dev
        run: |
          set -uo pipefail
          sh tests/relay-session.sh dist/x86_64-linux-musl "$RELAY"
      - name: what the relay says right now
        if: always()
        run: |
          set -u
          # ⛔ FETCHED REGARDLESS OF THE OUTCOME ABOVE, because it is the one
          # measurement here that cannot be taken from this repository, and it
          # says whether the rest was even measuring the thing it names.
          curl -fsSL --max-time 20 "https://$RELAY/health" || \
            echo "could not reach https://$RELAY/health"
      - name: upload the build info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-session
          path: dist/x86_64-linux-musl/BUILDINFO
          if-no-files-found: warn
